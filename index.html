<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffeef6, #ffd6e7);
      font-family: system-ui, sans-serif;
    }

    .card {
      background: rgba(255,255,255,0.9);
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      width: min(520px, 92vw);
    }

    h1 {
      font-size: clamp(26px, 4vw, 42px);
      margin-bottom: 18px;
    }

    .button-zone {
      position: relative;
      height: 150px;
      margin-top: 10px;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 18px 34px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.15);
      user-select: none;
      transition: transform 0.1s ease;
    }

    #yesBtn {
      left: 18%;
      background: #ff3b7a;
      color: white;
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.75;
    }

    .result {
      display: none;
      margin-top: 24px;
      font-size: 42px;
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Lena vil du være min Valentine?</h1>

    <div class="button-zone" id="zone">
      <button id="yesBtn">Ja</button>
      <button id="noBtn">Nej</button>
    </div>

    <div class="hint" id="hint">Du kan ikke sige nej 😈</div>

    <div class="result" id="result">YEEEEEEEEEEES🥳</div>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    let yesScale = 1.25;
    let noScale = 1;

    yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    zone.addEventListener("pointermove", e => {
      const nb = noBtn.getBoundingClientRect();
      const cx = nb.left + nb.width / 2;
      const cy = nb.top + nb.height / 2;

      const dist = Math.hypot(cx - e.clientX, cy - e.clientY);

      if (dist < 160) {
        // Nej bliver mindre
        noScale = clamp(dist / 160, 0.3, 1);
        noBtn.style.transform = `translateY(-50%) scale(${noScale})`;

        // Ja bliver MEGET større
        yesScale = clamp(yesScale + 0.12, 1.25, 3.2);
        yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
      }
    });

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
    });
  </script>
</body>
</html>
