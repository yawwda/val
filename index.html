<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Valentine</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#ffeef6;
      --card:#ffffffcc;
      --yes:#ff3b7a;
      --yesHover:#ff1f68;
      --text:#111827;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow:hidden;
      padding:16px;
      color:var(--text);
    }

    #fxCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    .card{
      width:min(720px, 92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
    }

    h1{
      font-size:clamp(26px, 4vw, 44px);
      margin:10px 0 18px;
    }

    .button-zone{
      position:relative;
      width:min(520px, 92%);
      height:160px;
      margin:0 auto;
      touch-action:none;
    }

    button{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      padding:16px 26px;
      font-size:18px;
      font-weight:900;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:background .12s ease, transform .12s ease;
      will-change:transform;
    }

    #yesBtn{
      left:18%;
      background:var(--yes);
      color:#fff;
    }
    #yesBtn:hover{ background:var(--yesHover); }

    #noBtn{
      left:62%;
      background:#e5e7eb;
      color:#111827;
    }

    .hint{
      margin-top:10px;
      font-size:13px;
      opacity:.75;
    }

    .page{
      display:none;
      animation:pop .35s ease;
    }
    .page.active{ display:block; }

    .result{
      font-size:clamp(28px, 4vw, 46px);
      margin:8px 0 0;
      font-weight:900;
    }

    .sub{
      margin-top:10px;
      font-size:16px;
      opacity:.85;
    }

    @keyframes pop{
      from{ transform:scale(.96); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }

    @keyframes pump{
      0%{ transform:translateY(-50%) scale(var(--s)); }
      55%{ transform:translateY(-50%) scale(calc(var(--s) * 1.08)); }
      100%{ transform:translateY(-50%) scale(var(--s)); }
    }
  </style>
</head>

<body>
  <canvas id="fxCanvas"></canvas>

  <main class="card">
    <section id="page1" class="page active">
      <h1>Lena vil du være min Valentine?</h1>

      <div class="button-zone" id="zone">
        <button id="yesBtn">Ja</button>
        <button id="noBtn">Nej</button>
      </div>

      <div class="hint" id="hint">Du kan ikke sige nej 😈</div>
    </section>

    <section id="page2" class="page">
      <div class="result">YEEEEEEEEEEES🥳</div>
      <div class="sub">Okay okay, det er officielt 💘</div>
    </section>
  </main>

  <script>
    const zone   = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const hint   = document.getElementById("hint");

    const page1  = document.getElementById("page1");
    const page2  = document.getElementById("page2");

    /* ---------- FULLSCREEN FX (CONFETTI) ---------- */
    const fxCanvas = document.getElementById("fxCanvas");

    function resizeFxCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      fxCanvas.width  = Math.floor(innerWidth * dpr);
      fxCanvas.height = Math.floor(innerHeight * dpr);
      fxCanvas.style.width = "100vw";
      fxCanvas.style.height = "100vh";
    }

    resizeFxCanvas();
    addEventListener("resize", resizeFxCanvas);
    addEventListener("orientationchange", () => setTimeout(resizeFxCanvas, 150));

    const fx = confetti.create(fxCanvas, { resize:false, useWorker:true });

    function bigCelebration(){
      const end = Date.now() + 2200;

      (function frame(){
        fx({
          particleCount: 14,
          spread: 100,
          startVelocity: 50,
          ticks: 200,
          origin: { x: Math.random(), y: Math.random() * 0.35 }
        });
        if(Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        fx({
          particleCount: 380,
          spread: 140,
          startVelocity: 62,
          ticks: 240,
          origin: { x: 0.5, y: 0.6 }
        });
      }, 350);

      setTimeout(() => {
        fx({
          particleCount: 120,
          spread: 80,
          startVelocity: 35,
          ticks: 160,
          scalar: 1.15,
          shapes: ["circle"],
          origin: { x: 0.5, y: 0.55 }
        });
      }, 850);
    }

    /* ---------- YES: 4 KLIK, 4 VOKS, SÅ NÆSTE SIDE ---------- */
    let yesClicks = 0;
    let yesScale = 1.25;         // starter lidt større
    const yesStep = 0.22;        // hvor meget den vokser pr klik
    const yesMax  = 3.8;         // kan blive meget stor

    function applyYesScale(pump=false){
      const s = Math.min(yesMax, yesScale);
      yesBtn.style.setProperty("--s", s.toFixed(3));
      if(pump){
        yesBtn.style.animation = "none";
        // reflow for at genstarte animation
        void yesBtn.offsetWidth;
        yesBtn.style.animation = "pump 140ms ease";
      }
      yesBtn.style.transform = `translateY(-50%) scale(${s})`;
    }

    applyYesScale(false);

    yesBtn.addEventListener("click", () => {
      yesClicks += 1;
      yesScale = Math.min(yesMax, yesScale + yesStep);
      applyYesScale(true);

      if(yesClicks >= 4){
        page1.classList.remove("active");
        page2.classList.add("active");
        resizeFxCanvas();
        bigCelebration();
      }
    });

    /* ---------- NO: BLIVER MINDRE JO TÆTTERE DU ER + RYKKER SIG ---------- */
    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoAway(px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width/2) - px;
      let dy = (b.top  + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top  - z.top ) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width  - b.width);
      newTop  = clamp(newTop,  0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop  + "px";
    }

    zone.addEventListener("pointermove", (e) => {
      const b = noBtn.getBoundingClientRect();
      const cx = b.left + b.width/2;
      const cy = b.top  + b.height/2;

      const dist = Math.hypot(cx - e.clientX, cy - e.clientY);

      // Nej bliver mindre når man nærmer sig (ned til 0.25x)
      const t = clamp(dist / 180, 0.25, 1);
      noBtn.style.transform = `translateY(-50%) scale(${t})`;

      // Når man er tæt på, så flytter den sig også
      if(dist < 150){
        moveNoAway(e.clientX, e.clientY);
      }
    });

    // Gør det svært at “cheate” ved klik på Nej
    noBtn.addEventListener("click", (e) => e.preventDefault());

  </script>
</body>
</html>
