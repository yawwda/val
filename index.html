<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Valentine</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#ffeef6;
      --card:#ffffffcc;
      --yes:#ff3b7a;
      --yesHover:#ff1f68;
      --text:#111827;
    }
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow:hidden;
      padding:16px;
      color:var(--text);
    }

    /* Fullscreen FX canvas */
    #fxCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    .card{
      width:min(720px, 92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      position:relative;
      z-index:1;
    }

    h1{
      font-size:clamp(26px, 4vw, 44px);
      margin:10px 0 18px;
    }

    .button-zone{
      position:relative;
      width:min(520px, 92%);
      height:170px;
      margin:0 auto;
      touch-action:none;
    }

    button{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      padding:16px 26px;
      font-size:18px;
      font-weight:900;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:background .12s ease, transform .12s ease, filter .12s ease;
      will-change:transform;
    }

    #yesBtn{
      left:18%;
      background:var(--yes);
      color:#fff;
      filter: drop-shadow(0 10px 18px rgba(255,59,122,.35));
    }
    #yesBtn:hover{ background:var(--yesHover); }

    #noBtn{
      left:62%;
      background:#e5e7eb;
      color:#111827;
    }

    .hint{
      margin-top:10px;
      font-size:13px;
      opacity:.75;
    }

    .page{ display:none; animation:pop .35s ease; }
    .page.active{ display:block; }

    .result{
      font-size:clamp(30px, 4.5vw, 52px);
      font-weight:1000;
      margin:8px 0 0;
      letter-spacing:.4px;
    }
    .sub{
      margin-top:10px;
      font-size:16px;
      opacity:.85;
    }

    @keyframes pop{
      from{ transform:scale(.96); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }

    /* “PUMP” animation for YES */
    @keyframes pump{
      0%   { transform:translateY(-50%) scale(var(--s)); }
      55%  { transform:translateY(-50%) scale(calc(var(--s) * 1.12)); }
      100% { transform:translateY(-50%) scale(var(--s)); }
    }

    /* Little “shake” on final */
    @keyframes shake {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      20% { transform: translate(-2px, 1px) rotate(-0.6deg); }
      40% { transform: translate(2px, -1px) rotate(0.6deg); }
      60% { transform: translate(-1px, -2px) rotate(-0.4deg); }
      80% { transform: translate(1px, 2px) rotate(0.4deg); }
    }

    .party-mode .card{
      animation: shake 450ms ease-in-out 3;
    }
  </style>
</head>

<body>
  <canvas id="fxCanvas"></canvas>

  <main class="card">
    <section id="page1" class="page active">
      <h1>Lena vil du være min Valentine?</h1>

      <div class="button-zone" id="zone">
        <button id="yesBtn">Ja</button>
        <button id="noBtn">Nej</button>
      </div>

      <div class="hint" id="hint">Du kan ikke sige nej 😈</div>
    </section>

    <section id="page2" class="page">
      <div class="result">YEEEEEEEEEEES🥳</div>
      <div class="sub">Okay okay, det er officielt 💘</div>
    </section>
  </main>

  <script>
    const zone   = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const hint   = document.getElementById("hint");

    const page1  = document.getElementById("page1");
    const page2  = document.getElementById("page2");

    /* ---------- FULLSCREEN FX (CONFETTI) ---------- */
    const fxCanvas = document.getElementById("fxCanvas");

    function resizeFxCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      fxCanvas.width  = Math.floor(innerWidth * dpr);
      fxCanvas.height = Math.floor(innerHeight * dpr);
      fxCanvas.style.width = "100vw";
      fxCanvas.style.height = "100vh";
    }

    resizeFxCanvas();
    addEventListener("resize", resizeFxCanvas);
    addEventListener("orientationchange", () => setTimeout(resizeFxCanvas, 150));

    const fx = confetti.create(fxCanvas, { resize:false, useWorker:true });

    function burst(originX, originY, count=80, spread=80, vel=50){
      fx({
        particleCount: count,
        spread,
        startVelocity: vel,
        ticks: 220,
        origin: { x: originX, y: originY }
      });
    }

    function insaneCelebration(){
      document.body.classList.add("party-mode");

      // Continuous “rain”
      const end = Date.now() + 2800;
      (function rain(){
        fx({
          particleCount: 16,
          spread: 120,
          startVelocity: 55,
          ticks: 220,
          origin: { x: Math.random(), y: Math.random() * 0.25 }
        });
        if(Date.now() < end) requestAnimationFrame(rain);
      })();

      // Big center blasts
      setTimeout(() => burst(0.5, 0.62, 420, 150, 65), 250);
      setTimeout(() => burst(0.5, 0.62, 260, 120, 55), 850);

      // Side cannons
      setTimeout(() => burst(0.1, 0.75, 180, 70, 55), 520);
      setTimeout(() => burst(0.9, 0.75, 180, 70, 55), 520);

      // Extra sparkly circles
      setTimeout(() => {
        fx({
          particleCount: 180,
          spread: 90,
          startVelocity: 40,
          ticks: 180,
          scalar: 1.2,
          shapes: ["circle"],
          origin: { x: 0.5, y: 0.58 }
        });
      }, 1150);

      setTimeout(() => document.body.classList.remove("party-mode"), 2200);
    }

    /* ---------- YES: 6 KLIK, 6 VOKS, SÅ NÆSTE SIDE ---------- */
    let yesClicks = 0;

    // Starter stor + bliver MEGET stor
    let yesScale = 1.35;
    const yesStep = 0.42;      // større step pr klik
    const yesMax  = 7.0;       // kan blive kæmpe

    function applyYesScale(pump=false){
      const s = Math.min(yesMax, yesScale);
      yesBtn.style.setProperty("--s", s.toFixed(3));

      if(pump){
        yesBtn.style.animation = "none";
        void yesBtn.offsetWidth;
        yesBtn.style.animation = "pump 150ms ease";
      }

      yesBtn.style.transform = `translateY(-50%) scale(${s})`;
    }

    applyYesScale(false);

    yesBtn.addEventListener("click", () => {
      yesClicks += 1;
      yesScale = Math.min(yesMax, yesScale + yesStep);
      applyYesScale(true);

      // lille “mini-burst” ved hvert klik (fra knappen)
      const r = yesBtn.getBoundingClientRect();
      const ox = (r.left + r.width/2) / innerWidth;
      const oy = (r.top  + r.height/2) / innerHeight;
      burst(ox, oy, 40, 70, 45);

      if(yesClicks >= 6){
        page1.classList.remove("active");
        page2.classList.add("active");
        resizeFxCanvas();
        insaneCelebration();
      }
    });

    /* ---------- NO: BLIVER MINDRE JO TÆTTERE DU ER + RYKKER SIG ---------- */
    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoAway(px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width/2) - px;
      let dy = (b.top  + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newLeft = (b.left - z.left) + dx * 160;
      let newTop  = (b.top  - z.top ) + dy * 160;

      newLeft = clamp(newLeft, 0, z.width  - b.width);
      newTop  = clamp(newTop,  0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop  + "px";
    }

    zone.addEventListener("pointermove", (e) => {
      const b = noBtn.getBoundingClientRect();
      const cx = b.left + b.width/2;
      const cy = b.top  + b.height/2;

      const dist = Math.hypot(cx - e.clientX, cy - e.clientY);

      // Nej bliver mindre når man nærmer sig (ned til 0.18x)
      const t = clamp(dist / 190, 0.18, 1);
      noBtn.style.transform = `translateY(-50%) scale(${t})`;

      // Når man er tæt på, så flytter den sig også
      if(dist < 155){
        moveNoAway(e.clientX, e.clientY);
      }
    });

    noBtn.addEventListener("click", (e) => e.preventDefault());
  </script>
</body>
</html>
